{% set name = "tree-sitter-javascript" %}
{% set pypi_name = "tree_sitter_javascript" %}
{% set version = "0.25.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ pypi_name }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: 329b5414874f0588a98f1c291f1b28138286617aa907746ffe55adfdcf963f38

build:
  number: 0
  # upstream requires-python >=3.10
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=62.4.0
    - wheel
  run:
    - python
  run_constrained:
    # upstream [project.optional-dependencies] 'core' extra: tree-sitter~=0.24
    # the core binding publishes as conda name tree_sitter (underscore) per its
    # packaging convention; inert until that package exists on pkgs/main
    # upstream 'core' extra says tree-sitter~=0.24, but this grammar is ABI 15,
    # which needs tree-sitter >=0.25
    - tree_sitter >=0.25,<1.0

test:
  requires:
    - pip
    - tree_sitter
  imports:
    - tree_sitter_javascript
  commands:
    - pip check
    # parse with the core binding (tree_sitter) to prove the grammar loads and
    # produces the expected root node; abi_version cross-checks the grammar's
    # LANGUAGE_VERSION with the runtime
    - python -c "import tree_sitter, tree_sitter_javascript; lang = tree_sitter.Language(tree_sitter_javascript.language()); assert lang.abi_version == 15, lang.abi_version; tree = tree_sitter.Parser(lang).parse(b'function f() { return 1; }'); assert tree.root_node.type == 'program', tree.root_node.type"

about:
  home: https://github.com/tree-sitter/tree-sitter-javascript
  summary: JavaScript grammar for tree-sitter
  description: >-
    JavaScript grammar for tree-sitter, providing a parser for JavaScript
    source code built with the tree-sitter incremental parsing toolkit.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/tree-sitter/tree-sitter-javascript#readme
  dev_url: https://github.com/tree-sitter/tree-sitter-javascript

extra:
  recipe-maintainers:
    - rxm7706
    - killua156
    - mgorny
